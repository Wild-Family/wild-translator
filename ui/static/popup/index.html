<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>わいるどぱんち</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body,
      #app {
        width: 520px;
        min-width: 520px;
        height: 600px;
        min-height: 600px;
        max-height: 600px;
      }

      html,
      body {
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      #app {
        display: flex;
      }

      .popup-root {
        width: 520px;
        min-width: 520px;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        box-sizing: border-box;
      }

      .popup-header,
      .popup-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .popup-header {
        margin-bottom: 8px;
      }

      .popup-title {
        margin: 0;
        font-size: 14px;
      }

      .popup-settings {
        font-size: 12px;
        background: none;
        border: none;
        padding: 0;
        color: var(--accent-strong);
        text-decoration: underline;
        cursor: pointer;
      }

      .popup-error {
        background: #fee;
        border: 1px solid #f99;
        color: #7f1d1d;
        padding: 8px;
        margin-bottom: 8px;
        font-size: 12px;
      }

      .popup-error[hidden] {
        display: none;
      }

      .popup-loading {
        flex: 1;
      }

      .popup-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        gap: 8px;
        overflow: hidden;
      }

      .popup-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        align-items: center;
      }

      .popup-prompt {
        flex: 1;
      }

      .popup-form {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .popup-input {
        width: 100%;
        resize: none;
      }

      .popup-actions {
        display: flex;
        margin-block: 0.5rem;
      }

      #popup-run {
        flex: 1;
        padding: 8px 16px;
      }

      .popup-output {
        flex: 1;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 8px;
        padding: 10px;
        min-height: 0;
        line-height: 1.55;
        overflow-y: auto;
        overflow-wrap: anywhere;
      }

      .popup-output > * + *,
      .popup-output blockquote > * + *,
      .popup-output li > * + * {
        margin-top: 0.5em;
      }

      .popup-output h1,
      .popup-output h2,
      .popup-output h3,
      .popup-output h4,
      .popup-output h5,
      .popup-output h6 {
        line-height: 1.3;
        font-weight: 600;
      }

      .popup-output h1 {
        font-size: 1.25em;
      }

      .popup-output h2 {
        font-size: 1.15em;
      }

      .popup-output h3 {
        font-size: 1.05em;
      }

      .popup-output h4,
      .popup-output h5,
      .popup-output h6 {
        font-size: 1em;
      }

      .popup-output code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 4px;
      }

      .popup-output pre {
        background: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        overflow-x: auto;
      }

      .popup-output pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: 0.85em;
        white-space: pre;
      }

      .popup-output blockquote {
        border-left: 3px solid var(--border);
        padding-left: 10px;
        color: var(--muted);
      }

      .popup-output ul,
      .popup-output ol {
        padding-left: 1.4em;
      }

      .popup-output li + li {
        margin-top: 0.2em;
      }

      .popup-output table {
        border-collapse: collapse;
        font-size: 0.95em;
        display: block;
        overflow-x: auto;
      }

      .popup-output th,
      .popup-output td {
        border: 1px solid var(--border);
        padding: 4px 8px;
        text-align: left;
      }

      .popup-output th {
        background: var(--surface-muted);
      }

      .popup-output hr {
        border: none;
        border-top: 1px solid var(--border);
      }

      .popup-theme {
        padding: 6px 10px;
        font-size: 14px;
      }

      .is-hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="popup-root">
        <header class="popup-header">
          <h1 class="popup-title">わいるどぱんち</h1>
          <button
            id="popup-settings"
            class="popup-settings"
            type="button"
          >
            Settings
          </button>
        </header>

        <div
          id="popup-error"
          class="popup-error"
          hidden
          role="alert"
          aria-live="polite"
        ></div>

        <div id="popup-loading" class="popup-loading">Loading...</div>

        <section
          id="popup-shell"
          class="popup-main is-hidden"
          aria-label="Popup translator"
        >
          <div class="popup-toolbar">
            <select
              id="popup-prompt-select"
              class="popup-prompt"
              aria-label="Prompt preset"
            ></select>
          </div>

          <div class="popup-form">
            <textarea
              id="popup-input"
              class="popup-input"
              placeholder="Input"
              rows="7"
            ></textarea>

            <div class="popup-actions">
              <button id="popup-run" type="button">Run</button>
            </div>

            <div id="popup-output" class="popup-output">Output</div>
          </div>
        </section>

        <footer class="popup-footer">
          <button
            id="popup-theme"
            type="button"
            class="btn-secondary popup-theme"
            aria-label="Switch to dark mode"
            title="Switch to dark mode"
          >
            🌙
          </button>
        </footer>
      </div>
    </div>
    <script type="module" src="../src/popup/index.js"></script>
  </body>
</html>
